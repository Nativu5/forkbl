[project]
name = "forkbl"
version = "0.1.0"
description = "Terminal client for a shterm bastion host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "pexpect>=4.9.0; sys_platform != 'win32'",
  "pywinpty>=3.0.0; sys_platform == 'win32'",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "rich>=13.9.0",
  "truststore>=0.9.1",
]

[project.scripts]
forkbl = "forkbl.__main__:main"
forkbl-askpass = "forkbl.askpass:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forkbl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "windows: requires the Windows ConPTY backend",
  "posix: requires the Unix PTY backend",
]
